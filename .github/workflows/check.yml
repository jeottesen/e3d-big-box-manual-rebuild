# The mandatory checks, as a workflow: tests, ruff, the link and image check on manual/, and markdownlint.
# It is the same as running `mise run check` locally.
#
# OFF until this repo has self-hosted runners: it only runs when started by hand. GitHub-hosted runners are not an option (no
# Actions credit), and the ARC runner set in server-config is registered to a different repo (laughing-octo-waffle), so
# `runs-on` would find no runner here. Once a runner set exists for this repo, set `runs-on` to its name and replace the
# `on:` block with:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
name: check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted   # GitHub-hosted runners need Actions credit; this repo uses its own runners
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2   # installs the tools pinned in mise.toml
      - run: mise run check
